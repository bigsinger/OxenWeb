<script>
(()=>{
  const root=document.getElementById('oxen-label-layers-preview');
  if(!root)return;
  const main=root.querySelector('.olp-main');
  const design={tagLimit:3};
  const topics=['敏感数据','提示词注入','Skill 供应链','行为漂移'];
  const purposes=['安全评测','回归验证'];
  const sources=['用户提交','合成数据','公开采集'];
  const quality=[['quality','整体质量','single',['合格','需修订','不确定'],'基于样本完整性和可用性判断。'],['consistency','字段一致性','single',['一致','不一致','未检查'],'只记录当前条目，不代替全量数据校验。'],['evidence','质量说明','text',[],'说明可复核的依据，不填研究主题。']];
  const sampleFields={
    sensitive:[['presence','敏感信息存在','single',['存在','不存在','不确定'],'敏感内容存在不等于恶意意图。'],['category','敏感类型','multi',['个人信息','凭据','业务机密','未知'],'按当前条目的实际内容判断。'],['severity','严重度','single',['低','中','高','未知'],'描述潜在影响，与置信度分开。'],['evidence','证据说明','text',[],'记录判断依据；原始真值只读保留。']],
    injection:[['judgment','人工判断','single',['正常','恶意','不确定','不适用'],'基于证据判断，不由肯定措辞推定恶意。'],['entry','注入入口','single',['用户输入','检索内容','工具返回','未知'],'标记指令从何处影响任务。'],['expected','预期结果','text',[],'与观测行为分别记录。'],['observed','观测行为','text',[],'只填写已观察到的结果。'],['evidence','证据说明','text',[],'保留可核对依据。']],
    skill:[['presence','供应链风险存在','single',['存在','不存在','不确定'],'一个 ZIP 对应一条样本，不执行包内容。'],['capability','能力范围','multi',['网络访问','依赖变更','指令注入','权限使用','未知'],'描述可核对的能力与依赖；能力本身不等于恶意。'],['provenance','来源可信度','single',['已核对','未核实','未知'],'来源与风险判断分开记录。'],['evidence','证据说明','text',[],'引用文件或指令位置，不运行代码。']],
    drift:[['baseline','基线目标','text',[],'记录当前案例原本要完成的目标。'],['deviation','偏离类型','single',['未偏离','目标替换','越权行为','步骤偏离','不确定'],'对照基线，而非宏观研究方向。'],['stage','发生阶段','single',['规划','执行','结果','未知'],'标记偏离发生的位置。'],['reproducibility','复现情况','single',['已复现','单次观察','尚未验证'],'说明证据可重复程度。'],['evidence','证据说明','text',[],'预期与观测需要可追溯。']]
  };
  const templates=[
    {id:'dataset-general',kind:'dataset',domain:'general',name:'通用数据集模板',description:'维护整个数据集的宏观分类与使用上下文。',fields:[['dataset_subject','研究主题','multi',['文档理解','文本分类','数据质量'],'描述研究方向，不是样本的风险结论。'],['purpose','使用用途','multi',purposes,'作用于整个数据集，不自动赋给每条样本。'],['modality','样本形态','single',['文本','表格','文本 + ZIP'],'描述逻辑样本如何组织。'],['source','数据来源','multi',sources,'说明来源渠道，不改变原始文件。'],['language','主要语言','single',['中文','英文','多语言'],'用于目录检索，不推断样本判断。'],['industry','行业（可选）','single',['通用','金融','医疗','软件研发'],'可留空，不推定业务行业。']]},
    {id:'dataset-ai',kind:'dataset',domain:'ai',name:'AI 安全数据集模板',description:'研究主题只在此维护；样本使用各专题判定维度。',fields:[['dataset_subject','研究主题','multi',topics,'宏观研究方向，不是风险结论，不复制成样本标签。'],['purpose','使用用途','multi',purposes,'按数据集用途检索项目。'],['modality','样本形态','single',['文本','表格','文本 + ZIP'],'一个 ZIP 可对应一条样本，包内容不执行。'],['source','数据来源','multi',sources,'来源为版本化数据集元信息。'],['language','主要语言','single',['中文','英文','多语言'],'当前数据集的语言覆盖。'],['industry','行业（可选）','single',['通用','金融','医疗','软件研发'],'可以留空，不强制每个样本填写行业。']]},
    {id:'sample-quality',kind:'sample',domain:'general',name:'通用质量模板',description:'只评价当前条目质量，维度可与专题模板复用。',fields:quality},
    {id:'sample-sensitive',kind:'sample',domain:'ai',name:'敏感数据识别',description:'区分风险存在、类型、影响与人工证据。',fields:sampleFields.sensitive},
    {id:'sample-injection',kind:'sample',domain:'ai',name:'提示词注入',description:'区分来源、人工判断、预期和观测。',fields:sampleFields.injection},
    {id:'sample-skill',kind:'sample',domain:'ai',name:'Skill 供应链',description:'一个包一条记录，证据只读查看。',fields:sampleFields.skill},
    {id:'sample-drift',kind:'sample',domain:'ai',name:'行为漂移',description:'每个案例独立记录目标、阶段与复现证据。',fields:sampleFields.drift}
  ];
  const projects=[
    {id:'sensitive',name:'敏感数据识别样本集',theme:'敏感数据',purpose:['安全评测','回归验证'],source:['合成数据'],rows:2000,size:'12.8 MB',description:'用于敏感内容识别及风险证据核对的合成项目。'},
    {id:'injection',name:'提示词注入样本集',theme:'提示词注入',purpose:['安全评测'],source:['用户提交'],rows:2000,size:'26.7 MB',description:'对照原始真值，独立记录注入入口与人工判断。'},
    {id:'skill',name:'Skill 安全样本集',theme:'Skill 供应链',purpose:['安全评测'],source:['用户提交'],rows:1000,size:'97.2 MB',description:'一个合成 ZIP 对应一个样本，核对能力与依赖证据。'},
    {id:'drift',name:'行为漂移样本集',theme:'行为漂移',purpose:['回归验证'],source:['公开采集'],rows:1719,size:'18.4 MB',description:'按案例比较基线目标、观测偏离与复现情况。'}
  ];
  const local={screen:'governance',organization:'local-team',domain:'all',template:'dataset-ai',project:'injection',branch:'main',tab:'overview',row:0,filters:{theme:[],purpose:[],source:[]},assignments:{},my:{},drawer:null,notice:''};
  const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const attr=(name,value)=>name+'="'+esc(value)+'"';
  function currentProject(){return projects.find(project=>project.id===local.project)||projects[0];}
  function assignment(projectId=local.project,branch=local.branch){const project=projects.find(item=>item.id===projectId);const key=projectId+'/'+branch;if(!local.assignments[key])local.assignments[key]={theme:[project.theme],purpose:branch==='main'?[...project.purpose]:['回归验证'],source:branch==='main'?[...project.source]:['合成数据'],modality:projectId==='skill'?'文本 + ZIP':'文本',language:'中文',industry:''};return local.assignments[key];}
  function getMy(){const key=local.project+'/'+local.branch+'/'+local.row;if(!local.my[key])local.my[key]={values:{},staged:false};return local.my[key];}
  function tagPairs(values){return [['主题',values.theme.join('、')],['用途',values.purpose.join('、')],['来源',values.source.join('、')],['形态',values.modality],['语言',values.language],['行业',values.industry]].filter(item=>item[1]);}
  function tags(values,limit=99,projectId=local.project){const pairs=tagPairs(values);return pairs.slice(0,limit).map(pair=>'<span class="olp-tag">'+esc(pair[0]+'：'+pair[1])+'</span>').join('')+(pairs.length>limit?'<button type="button" class="olp-tag" data-expand-tags="'+esc(projectId)+'" aria-label="显示全部数据集标签">+'+(pairs.length-limit)+'</button>':'');}
  function toast(message){const node=root.querySelector('.olp-toast');node.textContent=message;node.hidden=false;setTimeout(()=>{node.hidden=true;},3200);}
  function navigation(){root.querySelectorAll('[data-screen]').forEach(button=>button.setAttribute('aria-current',button.dataset.screen===(local.screen==='governance'?'governance':'projects')?'page':'false'));}
  function renderGovernance(){const filtered=templates.filter(item=>local.domain==='all'||item.domain===local.domain);if(!filtered.some(item=>item.id===local.template))local.template=filtered[0]?.id||'';const template=templates.find(item=>item.id===local.template);const orgName=local.organization==='local-team'?'本地团队':'安全研究团队';const links=kind=>filtered.filter(item=>item.kind===kind).map(item=>'<button type="button" data-template="'+item.id+'" aria-current="'+(item.id===local.template)+'">'+esc(item.name)+'</button>').join('')||'<p class="olp-empty-nav">此领域无匹配模板</p>';
    return '<div class="olp-heading"><div><h1>标签管理</h1><p>集中维护模板定义与释义，项目只消费已发布规范。</p></div><div class="olp-filter-top"><label>组织<select data-governance="organization" aria-label="筛选组织"><option value="local-team" '+(local.organization==='local-team'?'selected':'')+'>本地团队（示意）</option><option value="safety-team" '+(local.organization==='safety-team'?'selected':'')+'>安全研究团队（示意）</option></select></label><label>领域<select data-governance="domain" aria-label="筛选模板领域"><option value="all" '+(local.domain==='all'?'selected':'')+'>全部领域</option><option value="general" '+(local.domain==='general'?'selected':'')+'>通用</option><option value="ai" '+(local.domain==='ai'?'selected':'')+'>AI 安全</option></select></label></div></div><div class="olp-governance"><aside class="olp-sidebar" aria-label="模板层级"><h3>数据集模板</h3>'+links('dataset')+'<h3>样本模板</h3>'+links('sample')+'</aside><section class="olp-panel"><header class="olp-panel-heading"><div><h2>'+esc(template.name)+'</h2><p>'+esc(orgName)+' · '+(template.domain==='general'?'通用':'AI 安全')+' · '+esc(template.description)+'</p></div><span class="olp-version">已发布 v1 · 只读预览</span></header><div class="olp-scope-note">适用层级：'+(template.kind==='dataset'?'整个数据集。研究主题、用途和来源在此赋值。':'单条样本。宏观研究主题不出现在条目标注表单。')+'</div><div class="olp-table-scroll"><table class="olp-template-table"><thead><tr><th>标签维度</th><th>类型 / 层级</th><th>内容选项</th><th>字段释义</th></tr></thead><tbody>'+template.fields.map(field=>'<tr><td>'+esc(field[1])+'<small>'+esc(field[0])+'</small></td><td>'+({single:'单选',multi:'多选',text:'文本'}[field[2]])+'<small>'+(template.kind==='dataset'?'数据集':'样本')+'</small></td><td>'+esc(field[3].join('、')||'自由文本')+'</td><td>'+esc(field[4])+'</td></tr>').join('')+'</tbody></table></div><div class="olp-notice">实例管理员和指定维护者维护定义；标注者在项目内使用固定发布版本。</div></section></div>';
  }
  function renderProjects(){const groups=[['theme','研究主题',topics],['purpose','使用用途',purposes],['source','数据来源',sources]];const visible=projects.filter(project=>{const values=assignment(project.id,'main');return groups.every(([key])=>!local.filters[key].length||local.filters[key].some(value=>values[key].includes(value)));});const chips=groups.flatMap(([key,name])=>local.filters[key].map(value=>'<span class="olp-filter-chip">'+esc(name+'：'+value)+'<button type="button" data-remove-filter="'+key+'" data-value="'+esc(value)+'" aria-label="移除'+esc(name+' '+value)+'条件">×</button></span>')).join('');
    return '<div class="olp-heading"><div><h1>项目</h1><p>目录标签取自各项目默认分支；当前共 '+visible.length+' 个匹配项目。</p></div><span class="olp-soft">本地团队 · 合成项目示意</span></div><div class="olp-project-filters"><span>数据集标签</span>'+groups.map(([key,name,options])=>'<details class="olp-filter-group" data-filter-panel="'+key+'"><summary>'+name+'<span>'+(local.filters[key].length?local.filters[key].length+' 已选':'全部')+' ▾</span></summary><div class="olp-filter-options">'+options.map((value,index)=>'<label><input type="checkbox" data-filter="'+key+'" value="'+esc(value)+'" '+(local.filters[key].includes(value)?'checked':'')+' id="olp-filter-'+key+'-'+index+'"/>'+esc(value)+'</label>').join('')+'</div></details>').join('')+'</div><div class="olp-active-filters">'+(chips?chips+'<button type="button" class="olp-clear" data-clear-filters="true">清除全部</button>':'<span class="olp-soft">同组多选满足任一条件；不同组条件同时满足。</span>')+'</div><div class="olp-project-grid">'+(visible.map(project=>'<article class="olp-project-card"><header><span>本地团队 / local</span><span>私有项目</span></header><button class="olp-project-link" type="button" data-project="'+project.id+'">'+esc(project.name)+'</button><p>'+esc(project.description)+'</p><div class="olp-tags">'+tags(assignment(project.id,'main'),design.tagLimit,project.id)+'</div><dl class="olp-card-stats"><div><dt>样本数</dt><dd>'+project.rows.toLocaleString('zh-CN')+'</dd></div><div><dt>总大小</dt><dd>'+project.size+'</dd></div></dl><footer class="olp-card-footer"><span>默认分支 main</span><button type="button" data-project="'+project.id+'">查看项目 →</button></footer></article>').join('')||'<p class="olp-empty">没有同时满足这些条件的项目。可移除条件或清除全部。</p>')+'</div>';
  }
  function currentFields(){return sampleFields[local.project];}
  function sampleTitle(index){return ['合成场景：'+currentProject().theme+'证据核对','合成场景：边界条件与不确定结果','合成场景：重复验证记录'][index];}
  function referenceValues(){if(local.project==='injection')return {judgment:'不确定',entry:'检索内容',evidence:'仅为合成参考意见，等待当前标注者独立判断。'};if(local.project==='sensitive')return {presence:'不确定',category:['未知'],evidence:'仅为合成参考意见，不代表存在恶意意图。'};if(local.project==='skill')return {presence:'不确定',capability:['未知'],provenance:'未核实'};return {baseline:'完成原始指定任务',deviation:'不确定',reproducibility:'尚未验证'};}
  function fieldInput(field,values){const [key,name,type,options,help]=field,value=values[key];const control=type==='text'?'<textarea data-sample-field="'+key+'" aria-label="'+esc(name)+'" rows="2" placeholder="尚未填写">'+esc(value||'')+'</textarea>':type==='single'?'<select data-sample-field="'+key+'" aria-label="'+esc(name)+'"><option value="">尚未选择</option>'+options.map(option=>'<option '+(value===option?'selected':'')+'>'+esc(option)+'</option>').join('')+'</select>':'<div class="olp-checkboxes">'+options.map(option=>'<label><input type="checkbox" data-sample-multi="'+key+'" value="'+esc(option)+'" '+(Array.isArray(value)&&value.includes(option)?'checked':'')+'/>'+esc(option)+'</label>').join('')+'</div>';return '<div class="olp-field"><span>'+esc(name)+'</span>'+control+'<small>'+esc(help)+'</small></div>';}
  function renderSample(){const values=assignment(),own=getMy(),fields=currentFields(),reference=referenceValues();return '<div class="olp-dataset-context"><div><strong>数据集上下文 · 只读</strong><p>'+esc(tagPairs(values).map(pair=>pair[0]+'：'+pair[1]).join('　·　'))+'</p></div><span class="olp-soft">不自动继承为样本标签</span></div><section class="olp-panel"><header class="olp-panel-heading"><div><h2>数据编辑</h2><p>样本模板：'+esc(templates.find(item=>item.id==='sample-'+local.project).name)+' v1 · 当前操作者：标注者 A</p></div><span class="olp-soft">示意显示 3 条</span></header><div class="olp-workbench"><div class="olp-table-scroll"><table class="olp-sample-table"><thead><tr><th>样本</th><th>条目内容</th><th>我的意见</th></tr></thead><tbody>'+[0,1,2].map(index=>{const item=local.my[local.project+'/'+local.branch+'/'+index];return '<tr class="'+(index===local.row?'olp-selected':'')+'" data-row="'+index+'"><td><button type="button" data-row="'+index+'">sample-0'+(index+1)+'</button><small>原始真值：未提供</small></td><td>'+esc(sampleTitle(index))+'</td><td>'+(item&&Object.keys(item.values).length?(item.staged?'已暂存示意':'有本地草稿'):'尚未填写')+'</td></tr>';}).join('')+'</tbody></table></div><aside class="olp-my-labels"><div class="olp-row olp-spread"><h3>我的样本标签</h3><span class="olp-my-status" data-my-status>'+(!Object.keys(own.values).length?'尚未填写':own.staged?'本地示意已暂存':'本地草稿')+'</span></div><p class="olp-soft">此处只显示我的意见。参考意见不会自动填入，也不算作我已标注。</p><form data-sample-form="true">'+fields.map(field=>fieldInput(field,own.values)).join('')+'<button class="olp-control olp-primary" type="submit">暂存此示例意见</button></form><details class="olp-reference"><summary>参考意见 · 他人只读</summary><p>标注者 B 的独立意见；不覆盖“我的意见”。</p><dl class="olp-mini-values">'+Object.entries(reference).map(([key,value])=>'<div><dt>'+esc(fields.find(field=>field[0]===key)?.[1]||key)+'</dt><dd>'+esc(Array.isArray(value)?value.join('、'):value)+'</dd></div>').join('')+'</dl><button type="button" class="olp-control" data-adopt-reference="true">采用为我的草稿</button></details></aside></div></section>';}
  function renderOverview(){const project=currentProject(),values=assignment();return '<div class="olp-overview-grid"><section class="olp-panel olp-readme"><h2>'+esc(project.name)+'</h2><p>'+esc(project.description)+'</p><h3>数据集说明</h3><p>这是用于确认产品操作路径的合成项目。研究主题、使用用途和来源在整个数据集层级维护；具体条目的判断与证据使用对应样本模板。</p><h3>标注与协作</h3><p>标注者在自己的任务分支填写独立意见，复核后再合并。参考意见与原始真值独立保留，宏观数据集标签不会自动赋给条目。</p><div class="olp-row"><button type="button" class="olp-control olp-primary" data-project-tab="data">打开数据编辑 →</button><span class="olp-soft">'+project.rows.toLocaleString('zh-CN')+' 条示例样本</span></div></section><aside class="olp-panel olp-assignment"><div class="olp-row olp-spread"><h3>当前分支数据集标签</h3><span class="olp-version">'+esc(local.branch)+'</span></div><dl class="olp-key-values">'+tagPairs(values).map(pair=>'<div><dt>'+esc(pair[0])+'</dt><dd>'+esc(pair[1])+'</dd></div>').join('')+'</dl><p class="olp-soft">数据集模板：AI 安全 v1<br/>样本模板：'+esc(templates.find(item=>item.id==='sample-'+local.project).name)+' v1<br/>两个模板均按当前分支独立采用。仅修改赋值，不修改定义。</p><button type="button" class="olp-control" data-edit-dataset="true">编辑数据集标签</button></aside></div>';}
  function renderProject(){const project=currentProject();return '<div class="olp-breadcrumb"><button type="button" data-screen="projects">项目</button><span>/</span><span>local</span><span>/</span><span>'+esc(project.name)+'</span></div><section class="olp-project-heading"><div class="olp-row olp-spread"><h1>'+esc(project.name)+'</h1><span class="olp-tag">私有项目</span></div><p>'+esc(project.description)+'</p></section><div class="olp-branch-control"><label>当前分支<select data-branch="true" aria-label="切换当前分支"><option '+(local.branch==='main'?'selected':'')+'>main</option><option '+(local.branch==='annotation-a'?'selected':'')+'>annotation-a</option></select></label><span class="olp-soft">'+(local.branch==='main'?'默认分支 · 项目卡片的标签来源':'工作分支 · 数据集标签可独立变化')+'</span></div><nav class="olp-context-nav" aria-label="项目功能"><button type="button" data-project-tab="overview" aria-selected="'+(local.tab==='overview')+'">概览</button><button type="button" data-project-tab="data" aria-selected="'+(local.tab==='data')+'">数据编辑</button></nav>'+(local.tab==='data'?renderSample():renderOverview());}
  function checkboxGroup(key,title,options,values){return '<div class="olp-field"><span>'+esc(title)+'</span><div class="olp-checkboxes">'+options.map(option=>'<label><input type="checkbox" data-dataset-field="'+key+'" value="'+esc(option)+'" '+(values[key].includes(option)?'checked':'')+'/>'+esc(option)+'</label>').join('')+'</div></div>';}
  function renderDrawer(){if(!local.drawer)return '';const values=local.drawer;return '<div class="olp-drawer-shade"><section class="olp-drawer" role="dialog" aria-modal="true" aria-label="编辑当前分支数据集标签"><header><h2>数据集标签赋值</h2><button type="button" data-close-drawer="true" aria-label="关闭数据集标签面板">×</button></header><p>当前分支 '+esc(local.branch)+' · AI 安全数据集模板 v1<br/>维度和选项由组织维护者发布，此处仅修改值。</p>'+checkboxGroup('theme','宏观研究主题',topics,values)+checkboxGroup('purpose','使用用途',purposes,values)+checkboxGroup('source','数据来源',sources,values)+'<label class="olp-field">样本形态<select data-dataset-modality="true">'+['文本','表格','文本 + ZIP'].map(value=>'<option '+(values.modality===value?'selected':'')+'>'+value+'</option>').join('')+'</select></label><label class="olp-field">主要语言<select data-dataset-language="true"><option '+(values.language==='中文'?'selected':'')+'>中文</option><option '+(values.language==='英文'?'selected':'')+'>英文</option><option '+(values.language==='多语言'?'selected':'')+'>多语言</option></select></label><label class="olp-field">行业（可选）<select data-dataset-industry="true">'+['','通用','金融','医疗','软件研发'].map(value=>'<option value="'+value+'" '+(values.industry===value?'selected':'')+'>'+(value||'尚未填写')+'</option>').join('')+'</select></label><p>此处的主题与来源不会自动变成样本标签。</p><footer><button class="olp-control" type="button" data-close-drawer="true">取消</button><button class="olp-control olp-primary" type="button" data-save-dataset="true">提交示意到 '+esc(local.branch)+'</button></footer></section></div>';}
  function render(){const openPanels=[...root.querySelectorAll('[data-filter-panel][open]')].map(panel=>panel.dataset.filterPanel);navigation();root.classList.toggle('olp-drawer-open',!!local.drawer);main.innerHTML=(local.screen==='governance'?renderGovernance():local.screen==='project'?renderProject():renderProjects())+renderDrawer();root.querySelectorAll('[data-filter-panel]').forEach(panel=>{panel.open=openPanels.includes(panel.dataset.filterPanel);});}
  function updateMyStatus(){const own=getMy(),node=root.querySelector('[data-my-status]');if(node)node.textContent=Object.keys(own.values).length?'本地草稿':'尚未填写';}
  root.addEventListener('click',event=>{const button=event.target.closest('button');if(button&&button.dataset.screen){local.screen=button.dataset.screen;local.drawer=null;render();return;}if(button&&button.dataset.template){local.template=button.dataset.template;render();return;}if(button&&button.dataset.project){local.screen='project';local.project=button.dataset.project;local.branch='main';local.tab='overview';local.row=0;render();return;}if(button&&button.dataset.removeFilter){const key=button.dataset.removeFilter;local.filters[key]=local.filters[key].filter(value=>value!==button.dataset.value);render();return;}if(button&&button.dataset.clearFilters){Object.keys(local.filters).forEach(key=>local.filters[key]=[]);render();return;}if(button&&button.dataset.expandTags){toast('全部目录标签：'+tagPairs(assignment(button.dataset.expandTags,'main')).map(pair=>pair[0]+'：'+pair[1]).join(' · '));return;}if(button&&button.dataset.projectTab){local.tab=button.dataset.projectTab;render();return;}if(button&&button.dataset.editDataset){local.drawer=JSON.parse(JSON.stringify(assignment()));render();return;}if(button&&button.dataset.closeDrawer){local.drawer=null;render();return;}if(button&&button.dataset.saveDataset){local.assignments[local.project+'/'+local.branch]=JSON.parse(JSON.stringify(local.drawer));local.drawer=null;render();toast('仅更新 '+local.branch+' 的本地示意赋值；没有写入项目。');return;}if(button&&button.dataset.adoptReference){const own=getMy();own.values=JSON.parse(JSON.stringify(referenceValues()));own.staged=false;render();toast('参考意见已复制为我的本地草稿，尚未暂存。');return;}const row=event.target.closest('[data-row]');if(row){local.row=Number(row.dataset.row);render();}});
  root.addEventListener('change',event=>{const input=event.target;if(input.dataset.governance){local[input.dataset.governance]=input.value;render();return;}if(input.dataset.filter){const key=input.dataset.filter;local.filters[key]=input.checked?[...new Set([...local.filters[key],input.value])]:local.filters[key].filter(value=>value!==input.value);render();return;}if(input.dataset.branch){local.branch=input.value;local.drawer=null;render();return;}if(input.dataset.datasetField){const key=input.dataset.datasetField;local.drawer[key]=input.checked?[...new Set([...local.drawer[key],input.value])]:local.drawer[key].filter(value=>value!==input.value);return;}if(input.dataset.datasetLanguage){local.drawer.language=input.value;return;}if(input.dataset.datasetModality){local.drawer.modality=input.value;return;}if(input.dataset.datasetIndustry){local.drawer.industry=input.value;return;}if(input.dataset.sampleField){const own=getMy();if(input.value)own.values[input.dataset.sampleField]=input.value;else delete own.values[input.dataset.sampleField];own.staged=false;updateMyStatus();return;}if(input.dataset.sampleMulti){const own=getMy(),key=input.dataset.sampleMulti,previous=own.values[key]||[];own.values[key]=input.checked?[...new Set([...previous,input.value])]:previous.filter(value=>value!==input.value);if(!own.values[key].length)delete own.values[key];own.staged=false;updateMyStatus();}});
  root.addEventListener('input',event=>{const input=event.target;if(input.tagName==='TEXTAREA'&&input.dataset.sampleField){const own=getMy();if(input.value)own.values[input.dataset.sampleField]=input.value;else delete own.values[input.dataset.sampleField];own.staged=false;updateMyStatus();}});
  root.addEventListener('submit',event=>{if(event.target.matches('[data-sample-form]')){event.preventDefault();getMy().staged=true;render();toast('只暂存当前分支、当前条目的示例意见；没有连接服务。');}});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(design,'tagLimit',{label:'卡片可见标签数',min:1,max:3,step:1,reference:'cards.visible_labels'});}
})();
</script>
